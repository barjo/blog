<!doctype html>
<html lang="en">
  <script>
    document.documentElement.dataset.theme =
      localStorage.getItem("theme") || (window.matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
  </script>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Confession of a Barjo — A software engineer's notebook" />
    <meta name="author" content="Jonathan M. Bardin" />
    <meta property="og:title" content="Confession of a Barjo" />
    <meta property="og:description" content="A software engineer's notebook" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="favicon.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Confession of a Barjo" />
    <meta name="twitter:description" content="A software engineer's notebook" />
    <title>Confession of a Barjo</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="elm.js"></script>
    <script>
      var app = Elm.Main.init({
        node: document.getElementById("app"),
        flags: { theme: document.documentElement.dataset.theme },
      });

      app.ports.saveTheme.subscribe(function (theme) {
        document.documentElement.dataset.theme = theme;
        localStorage.setItem("theme", theme);
      });

      // Prevent browser default for Ctrl/Cmd+K — Elm handles the rest.
      document.addEventListener("keydown", function (e) {
        if ((e.ctrlKey || e.metaKey) && e.key === "k") e.preventDefault();
      });
    </script>
  </body>
</html>
