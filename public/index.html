<!doctype html>
<html lang="en">
  <script>
    document.documentElement.dataset.theme =
      localStorage.getItem("theme") || (window.matchMedia("(prefers-color-scheme:dark)").matches ? "dark" : "light");
  </script>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Confession of a Barjo — A software engineer's notebook" />
    <meta name="author" content="Jonathan M. Bardin" />
    <meta property="og:title" content="Confession of a Barjo" />
    <meta property="og:description" content="A software engineer's notebook" />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="favicon.svg" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Confession of a Barjo" />
    <meta name="twitter:description" content="A software engineer's notebook" />
    <title>Confession of a Barjo</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,400;0,600;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap"
    />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="app"></div>
    <script src="elm.js"></script>
    <script>
      Elm.Main.init({ node: document.getElementById("app") });

      customElements.define(
        "theme-toggle",
        class extends HTMLElement {
          connectedCallback() {
            this.style.cursor = "pointer";
            this.setAttribute("aria-label", "Toggle theme");
            this.render();
            this.addEventListener("click", () => {
              const next_theme = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
              document.documentElement.dataset.theme = next_theme;
              localStorage.setItem("theme", next_theme);
              this.render();
            });
          }
          render() {
            const dark = document.documentElement.dataset.theme === "dark";
            this.innerHTML = dark
              ? '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>'
              : '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><path d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42"/></svg>';
          }
        },
      );
    </script>
  </body>
</html>
